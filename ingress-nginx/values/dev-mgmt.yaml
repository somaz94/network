global:
  image:
    registry: registry.k8s.io
controller:
  service:
    enabled: true
    type: LoadBalancer
    loadBalancerIP: "192.0.2.55"

  # =============================================================================
  # Metrics & ServiceMonitor (Prometheus)
  # Monitors: request rate, latency, error rate, connection count
  # =============================================================================
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      namespace: monitoring
      interval: 30s
      additionalLabels:
        release: kube-prometheus-stack
