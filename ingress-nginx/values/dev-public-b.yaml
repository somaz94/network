global:
  image:
    registry: registry.k8s.io
controller:
  enableAnnotationValidations: true
  allowSnippetAnnotations: true
  # Set annotation risk level to Critical to allow snippet annotations (v1.12+)
  config:
    annotations-risk-level: "Critical"
  ingressClassResource:
    name: nginx-public-b
    enabled: true
    default: false
    controllerValue: "k8s.io/ingress-nginx-public-b"
  service:
    enabled: true
    type: LoadBalancer
    loadBalancerIP: "192.0.2.57"
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      namespace: monitoring
      interval: 30s
      additionalLabels:
        release: kube-prometheus-stack
