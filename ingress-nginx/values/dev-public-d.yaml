global:
  image:
    registry: registry.k8s.io
controller:
  ingressClassResource:
    name: nginx-public-d
    enabled: true
    default: false
    controllerValue: "k8s.io/ingress-nginx-public-d"
  service:
    enabled: true
    type: LoadBalancer
    loadBalancerIP: "192.0.2.62"

  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      namespace: monitoring
      interval: 30s
      additionalLabels:
        release: kube-prometheus-stack
