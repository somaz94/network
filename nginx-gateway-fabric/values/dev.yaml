# NGINX Gateway Fabric controller customization.
# Upstream defaults are kept; only necessary overrides listed here.
#
# Gateway / NginxProxy CRs live in values/dev-cr.yaml (nginx-gateway-cr release), NOT here.

nginxGateway:
  # default: "nginx" → our repo uses "ngf" to coexist with legacy ingress-nginx
  gatewayClassName: ngf

  # chart default is 1; dev cluster matches legacy ingress-nginx convention (replicaCount: 1)
  replicas: 1

  # default: true → opt out of product telemetry (privacy)
  productTelemetry:
    enable: false

nginx:
  # chart default is 1; dev cluster matches legacy ingress-nginx convention
  replicas: 1
