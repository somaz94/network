# Per-release ArgoCD metadata for external-dns-aws on the EXAMPLE-APP-PROD cluster (EKS Auto
# Mode, account 123456789012). Consumed by that cluster's infra-applicationset git-files
# generator (argocd-applicationset repo, appsets/example-app-prod/infra/infra-applicationset.yaml)
# -> Application example-app-prod-infra-external-dns on the example-app-prod ArgoCD.
#
# 🔴 Read the header of values/example-app-prod.yaml before touching policy: upsert-only,
# txtOwnerId or annotation-filter: they were set to share the Route53 zone with the retired
# prod-example-app-v1 instance.
#
# 🔴 Marker dir is `argocd-example-app-prod/`, disjoint from every other argocd*/ marker:
# the generators all glob this
# SAME repo and the generated app name `infra-<releaseName>` is shared across clusters. Full
# rationale in the appset header.
#
# This file is the component's only chart pin; upgrade.py's CONFIG.ARGOCD_PIN_FILES lists this path.
#
# Adoption: this release was owned by the BOOTSTRAP helmfile (helmfile.yaml.gotmpl
# -e example-app-prod), which existed only to publish the DNS record for ArgoCD's own ingress
# before ArgoCD was running. It was enrolled MANUAL (autoSync:false), verified, then flipped --
# see the autoSync line below for the evidence. releaseName=external-dns keeps the same helm
# release, so ArgoCD adopted it in place.
component: external-dns-aws                     # -> app-name label on the generated App
releaseName: external-dns                       # helm release name (clean adoption). App name is <cluster>-infra-<releaseName> on this track -- the appset prefixes it; releaseName itself is NEVER prefixed
namespace: external-dns                         # already created by the bootstrap helmfile; do not contest ownership
syncWave: "1"                                   # core networking tier (reachability; mirrors helmfile deploy wave 1)
chart:
  repoURL: https://kubernetes-sigs.github.io/external-dns/
  name: external-dns
  version: "1.23.0"
valueFile: network/external-dns-aws/values/example-app-prod.yaml  # repo-root-relative; pulled via the gitops-infra $values multi-source ref
createNamespace: false                          # 'external-dns' already exists
autoSync: true                                  # adopt-diff verified 2026-08-31: the chart rendered from this file's pin + valueFile is IDENTICAL to the live helmfile release manifest, so the sync applied tracking-id annotations only -- same pod name/UID, 0 restarts, one ReplicaSet still at rollout revision 1 (Deployment metadata.generation 1->2 without a rollout). Auto-sync (prune+selfHeal) on.
