# Applied values for the example-app-prod (EKS Auto Mode, eu-central-1, account
# 123456789012) cluster.
#
# 🔴 Three fields below were set while the retired prod-example-app-v1 cluster ran a second
# external-dns against the SAME Route53 zone (until 2026-11-10). Read this before changing any:
#
#   1. policy: upsert-only   -- never DELETES a record.
#   2. txtOwnerId            -- distinct from the retired instance's. external-dns writes
#                               ownership into a TXT record and leaves records owned by a
#                               different id alone.
#   3. annotation-filter     -- a DIFFERENT annotation key. See below.
#
# txtPrefix is deliberately the SAME as the retired instance's, so this one reads its TXT
# ownership records instead of creating a duplicate A record for a name already taken.
image:
  repository: registry.k8s.io/external-dns/external-dns
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  # EKS Pod Identity, not IRSA -- the association already exists
  # (terraform-infra-aws project/example-app/prod/pod-identity, namespace external-dns /
  # SA external-dns). The pod-identity agent injects credentials at admission, so the SA
  # needs no eks.amazonaws.com/role-arn annotation.

# The platform pool (see compute/karpenter-automode). Unlike the source cluster's system
# node group this one is TAINTED, because a Karpenter pool scales and a managed node group
# did not -- so a toleration is required here where the old values file needed none.
nodeSelector:
  nodegroup-workload: platform
tolerations:
  - key: dedicated
    operator: Equal
    value: platform
    effect: NoSchedule

podSecurityContext:
  runAsNonRoot: true
  fsGroup: 65534

securityContext:
  privileged: false
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  capabilities:
    drop: ["ALL"]

rbac:
  create: true

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 256Mi

logLevel: info
logFormat: text

interval: 5m

sources:
  - service
  - ingress

# Never delete records -- see the header.
policy: upsert-only

registry: txt
# 🔴 Distinct from the retired instance's "example-app-external-dns" -- see the header.
txtOwnerId: "example-app-prod-external-dns"
# Same prefix as the retired instance on purpose -- see the header.
txtPrefix: "external-dns-"

domainFilters:
  - example.com

provider:
  name: aws

extraArgs:
  - --aws-zone-type=public
  - --aws-prefer-cname
  # 🔴 A DIFFERENT annotation key from the retired prod-example-app-v1 instance's
  # `external-dns.example-app.kubernetes.io/hostname`, so copying a workload's values file here
  # never repointed its hostname by accident; each cutover was a one-line, reviewable change.
  #
  # ⚠️ Consequence: a hostname is NOT published here until its Ingress carries
  # external-dns.example-app.kubernetes.io/hostname. If a record does not appear, check that
  # annotation first -- there is no error anywhere, the Ingress is just not selected.
  - --annotation-filter=external-dns.example-app.kubernetes.io/hostname

# kube-prometheus-stack landed on this cluster 2026-09-01, so this is on. It was off while the monitoring CRDs did not exist. The `release` label is for consistency only -- kube-prometheus-stack-aws sets serviceMonitorSelectorNilUsesHelmValues: false, so the ServiceMonitor is picked up regardless of label.
serviceMonitor:
  enabled: true
  additionalLabels:
    release: kube-prometheus-stack
